# code-craft 生产应用服务定义（由 deploy-template.yml 部署模板读取）
# 镜像一律引用模板导出的 IMAGE_* 变量；卷名固定为 code-craft-prod_*，
# 迁移自旧 CI 生成 compose，数据连续。相对路径挂载（./sql、./nginx.conf、
# ./node-builder）由 workflow 的 Prepare deployment files 步骤复制到部署目录。
services:
  mysql:
    image: mysql:8.0
    container_name: code-craft-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${DB_NAME:?required}
      MYSQL_USER: ${DB_USER:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/1_create_table.sql
      - ./mysql-init/mysql-schema.sql:/docker-entrypoint-initdb.d/2_nacos_schema.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - code-craft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: code-craft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - code-craft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos-db-init:
    image: mysql:8.0
    container_name: code-craft-nacos-db-init
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
    volumes:
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/1_create_table.sql
      - ./mysql-init/mysql-schema.sql:/docker-entrypoint-initdb.d/2_nacos_schema.sql
    networks:
      - code-craft-network
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for MySQL...';
        until mysql -h mysql -uroot -p${DB_ROOT_PASSWORD} -e 'SELECT 1' 2>/dev/null; do
          sleep 2;
        done;
        echo 'MySQL is ready, executing init scripts...';
        mysql -h mysql -uroot -p${DB_ROOT_PASSWORD} < /docker-entrypoint-initdb.d/1_create_table.sql;
        mysql -h mysql -uroot -p${DB_ROOT_PASSWORD} < /docker-entrypoint-initdb.d/2_nacos_schema.sql;
        echo 'Initialization completed, exiting...'
      "
    depends_on:
      mysql:
        condition: service_healthy

  nacos:
    image: nacos/nacos-server:v2.5.2
    container_name: code-craft-nacos
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx4g -Xms2g -Xss4m"
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: ${DB_USER:?required}
      MYSQL_SERVICE_PASSWORD: ${DB_PASSWORD:?required}
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_AUTH_PASSWORD: ${NACOS_PASSWORD:-nacos}
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_logs:/home/nacos/logs
      - nacos_data:/home/nacos/data
    networks:
      - code-craft-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/ns/instance/list?serviceName=nacos"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    image: ${IMAGE_USER_SERVICE:?required}
    container_name: code-craft-user-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:+UseG1GC"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      NACOS_HOST: nacos
      NACOS_PORT: "8848"
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports:
      - "8124:8124"
    networks:
      - code-craft-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    # 镜像内建 HEALTHCHECK 打的是网关路径 /api/actuator/health(容器内 404),
    # 与 screenshot 同款病灶,覆盖为容器内真实路径
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 --spider http://127.0.0.1:8124/actuator/health || wget -q -T 5 --spider http://127.0.0.1:8124/ || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

  app-service:
    image: ${IMAGE_APP_SERVICE:?required}
    container_name: code-craft-app-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1024m -Xms512m -XX:+UseG1GC"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      NACOS_HOST: nacos
      NACOS_PORT: "8848"
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      AI_CHAT_TIMEOUT: ${AI_CHAT_TIMEOUT:-45s}
      AI_CHAT_MAX_RETRIES: ${AI_CHAT_MAX_RETRIES:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      DEPLOY_HOST: ${DEPLOY_PUBLIC_HOST}
      CODE_OUTPUT_DIR: /tmp/code_output
      CODE_DEPLOY_DIR: /tmp/code_deploy
      CODE_UPLOAD_DIR: /tmp/uploads
      NODE_BUILDER_URL: http://node-builder:${NODE_BUILDER_PORT:-8020}/build
    ports:
      - "8126:8126"
    volumes:
      - code_output:/tmp/code_output
      - code_deploy:/tmp/code_deploy
      - code_upload:/tmp/uploads
    networks:
      - code-craft-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      node-builder:
        condition: service_started

  screenshot-service:
    image: ${IMAGE_SCREENSHOT_SERVICE:?required}
    container_name: code-craft-screenshot-service
    shm_size: 512mb
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      NACOS_HOST: nacos
      NACOS_PORT: "8848"
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_BUCKET: ${COS_BUCKET}
      COS_HOST: ${COS_HOST}
    ports:
      - "8127:8127"
    networks:
      - code-craft-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    # 镜像内建 HEALTHCHECK 打的是网关路径 /api/actuator/health(容器内 404),
    # 覆盖为容器内真实路径;两个路径兜底
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 --spider http://127.0.0.1:8127/actuator/health || wget -q -T 5 --spider http://127.0.0.1:8127/ || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

  node-builder:
    image: ${IMAGE_NODE_BUILDER:?required}
    container_name: code-craft-node-builder
    working_dir: /app
    volumes:
      - code_output:/tmp/code_output
    environment:
      NODE_ENV: production
      PORT: ${NODE_BUILDER_PORT:-8020}
    networks:
      - code-craft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${NODE_BUILDER_PORT:-8020}/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  frontend:
    image: ${IMAGE_FRONTEND:?required}
    container_name: code-craft-frontend
    restart: unless-stopped
    networks:
      - code-craft-network
    ports:
      - "8090:80"
    depends_on:
      app-service:
        condition: service_started
      user-service:
        condition: service_started
    # 镜像内建 HEALTHCHECK 用 localhost/--no-verbose 在容器内恒失败,
    # 这里覆盖为 127.0.0.1 + busybox 安全参数
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: code-craft-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - code_deploy:/usr/share/nginx/html/deploy
    networks:
      - code-craft-network
    depends_on:
      frontend:
        condition: service_started
      user-service:
        condition: service_started
      app-service:
        condition: service_started
      screenshot-service:
        condition: service_started
    # 与 frontend 同理:镜像内建 HEALTHCHECK 在容器内恒失败,覆盖之
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 5

volumes:
  mysql_data:
    name: code-craft-prod_mysql_data
  redis_data:
    name: code-craft-prod_redis_data
  nacos_logs:
    name: code-craft-prod_nacos_logs
  nacos_data:
    name: code-craft-prod_nacos_data
  code_deploy:
    name: code-craft-prod_code_deploy
  code_output:
    name: code-craft-prod_code_output
  code_upload:
    name: code-craft-prod_code_upload

networks:
  code-craft-network:
    driver: bridge
