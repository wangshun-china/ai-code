name: Build and Deploy

on:
  push:
    branches: [springaialibaba]
  workflow_dispatch:
    inputs:
      target_env:
        description: '请选择要部署的目标服务器'
        required: true
        default: 'wsl'
        type: choice
        options:
          - aliyun
          - wsl

permissions:
  contents: read
  packages: write

env:
  # 镜像仓库配置 (Single Source of Truth)
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
  CODE_CRAFT_IMAGE_NAME: ${{ vars.CODE_CRAFT_IMAGE_NAME }}

  # 应用配置
  APP_NAME: code-craft
  DEPLOY_DIR: code-craft-prod

  # 数据库配置
  CODE_CRAFT_MYSQL_ROOT_PASSWORD: ${{ secrets.CODE_CRAFT_MYSQL_ROOT_PASSWORD }}
  CODE_CRAFT_MYSQL_DATABASE: ${{ vars.CODE_CRAFT_MYSQL_DATABASE }}
  CODE_CRAFT_MYSQL_USERNAME: ${{ vars.CODE_CRAFT_MYSQL_USERNAME }}
  CODE_CRAFT_MYSQL_PASSWORD: ${{ secrets.CODE_CRAFT_MYSQL_PASSWORD }}
  CODE_CRAFT_MYSQL_PORT: ${{ vars.CODE_CRAFT_MYSQL_PORT }}

  # Redis配置
  CODE_CRAFT_REDIS_PORT: ${{ vars.CODE_CRAFT_REDIS_PORT }}

  # Nacos配置
  CODE_CRAFT_NACOS_PORT: ${{ vars.CODE_CRAFT_NACOS_PORT }}
  CODE_CRAFT_NACOS_USERNAME: ${{ vars.CODE_CRAFT_NACOS_USERNAME }}
  CODE_CRAFT_NACOS_PASSWORD: ${{ secrets.CODE_CRAFT_NACOS_PASSWORD }}

  # 服务端口
  USER_SERVICE_PORT: "8124"
  APP_SERVICE_PORT: "8126"
  SCREENSHOT_SERVICE_PORT: "8127"
  NODE_BUILDER_PORT: "8020"
  FRONTEND_PORT: "8090"
  NGINX_PORT: "8888"
  CODE_CRAFT_DEPLOY_PUBLIC_HOST: ${{ vars.CODE_CRAFT_DEPLOY_PUBLIC_HOST }}

  # 业务配置
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
  TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
  TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
  TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
  TENCENT_COS_HOST: ${{ vars.TENCENT_COS_HOST }}

jobs:
  resolve-context:
    name: Resolve Deploy Context
    runs-on: ubuntu-latest
    outputs:
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
      branch_slug: ${{ steps.resolve.outputs.branch_slug }}
      target_env: ${{ steps.resolve.outputs.target_env }}
    steps:
      - name: Resolve branch and target environment
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DEPLOY_REF="springaialibaba"
            TARGET_ENV="${{ github.event.inputs.target_env }}"
          else
            DEPLOY_REF="${{ github.ref_name }}"
            TARGET_ENV="wsl"
          fi

          BRANCH_SLUG=$(echo "${DEPLOY_REF}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')

          echo "deploy_ref=${DEPLOY_REF}" >> "$GITHUB_OUTPUT"
          echo "branch_slug=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"

          echo "Deploy ref: ${DEPLOY_REF}"
          echo "Branch slug: ${BRANCH_SLUG}"
          echo "Target env: ${TARGET_ENV}"

  build:
    name: Build Images
    needs: resolve-context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-context.outputs.deploy_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Backend
        run: cd code-craft-microservice && mvn clean package -DskipTests

      - name: Build Frontend
        run: |
          cd code-craft-frontend
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ env.ALIYUN_ACR_PASSWORD }}

      - name: Copy Build Artifacts
        run: |
          cp code-craft-microservice/code-craft-user/target/*.jar ./user-service.jar
          cp code-craft-microservice/code-craft-app/target/*.jar ./app-service.jar
          cp code-craft-microservice/code-craft-screenshot/target/*.jar ./screenshot-service.jar
          cp -r code-craft-frontend/dist .

      - name: Build and push User Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod-user
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:user-service-${{ needs.resolve-context.outputs.branch_slug }}-latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.CODE_CRAFT_IMAGE_NAME }}:user-service-${{ needs.resolve-context.outputs.branch_slug }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push App Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod-app
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:app-service-${{ needs.resolve-context.outputs.branch_slug }}-latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.CODE_CRAFT_IMAGE_NAME }}:app-service-${{ needs.resolve-context.outputs.branch_slug }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Screenshot Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod-screenshot
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:screenshot-service-${{ needs.resolve-context.outputs.branch_slug }}-latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.CODE_CRAFT_IMAGE_NAME }}:screenshot-service-${{ needs.resolve-context.outputs.branch_slug }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod-frontend
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:frontend-${{ needs.resolve-context.outputs.branch_slug }}-latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.CODE_CRAFT_IMAGE_NAME }}:frontend-${{ needs.resolve-context.outputs.branch_slug }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Node Builder
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod-node-builder
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:node-builder-${{ needs.resolve-context.outputs.branch_slug }}-latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.CODE_CRAFT_IMAGE_NAME }}:node-builder-${{ needs.resolve-context.outputs.branch_slug }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ needs.resolve-context.outputs.target_env }}
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-context, build]
    # 部署只允许手动触发，可选择目标环境和待部署分支。
    runs-on: [self-hosted, "${{ needs.resolve-context.outputs.target_env }}"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-context.outputs.deploy_ref }}

      - name: Resolve deployment image repository
        shell: bash
        env:
          IMAGE_TAG_SUFFIX: ${{ needs.resolve-context.outputs.branch_slug }}-latest
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "${{ github.token }}" |
            docker login "${{ env.GHCR_REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          printf '%s' "${{ env.ALIYUN_ACR_PASSWORD }}" |
            docker login "${{ env.ALIYUN_ACR_REGISTRY }}" -u "${{ env.ALIYUN_ACR_USERNAME }}" --password-stdin

          GHCR_REPOSITORY="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}"
          ACR_REPOSITORY="${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.CODE_CRAFT_IMAGE_NAME }}"
          SERVICES=(user-service app-service screenshot-service frontend node-builder)

          pull_release() {
            local repository="$1"
            local service
            for service in "${SERVICES[@]}"; do
              docker pull "${repository}:${service}-${IMAGE_TAG_SUFFIX}" || return 1
            done
          }

          if pull_release "$GHCR_REPOSITORY"; then
            IMAGE_REPOSITORY="$GHCR_REPOSITORY"
          elif pull_release "$ACR_REPOSITORY"; then
            echo "GHCR pull failed; using Aliyun ACR fallback."
            IMAGE_REPOSITORY="$ACR_REPOSITORY"
          else
            echo "Unable to pull the complete release from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Deploy Infrastructure
        env:
          CODE_CRAFT_IMAGE_NAME: ${{ env.CODE_CRAFT_IMAGE_NAME }}
          IMAGE_TAG_SUFFIX: ${{ needs.resolve-context.outputs.branch_slug }}-latest
          CODE_CRAFT_MYSQL_ROOT_PASSWORD: ${{ env.CODE_CRAFT_MYSQL_ROOT_PASSWORD }}
          CODE_CRAFT_MYSQL_DATABASE: ${{ env.CODE_CRAFT_MYSQL_DATABASE }}
          CODE_CRAFT_MYSQL_USERNAME: ${{ env.CODE_CRAFT_MYSQL_USERNAME }}
          CODE_CRAFT_MYSQL_PASSWORD: ${{ env.CODE_CRAFT_MYSQL_PASSWORD }}
          CODE_CRAFT_NACOS_USERNAME: ${{ env.CODE_CRAFT_NACOS_USERNAME }}
          CODE_CRAFT_NACOS_PASSWORD: ${{ env.CODE_CRAFT_NACOS_PASSWORD }}
          DASHSCOPE_API_KEY: ${{ env.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ env.DEEPSEEK_API_KEY }}
          TENCENT_COS_SECRET_ID: ${{ env.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ env.TENCENT_COS_SECRET_KEY }}
          TENCENT_COS_REGION: ${{ env.TENCENT_COS_REGION }}
          TENCENT_COS_BUCKET: ${{ env.TENCENT_COS_BUCKET }}
          TENCENT_COS_HOST: ${{ env.TENCENT_COS_HOST }}
          NODE_BUILDER_PORT: ${{ env.NODE_BUILDER_PORT }}
          CODE_CRAFT_DEPLOY_PUBLIC_HOST: ${{ env.CODE_CRAFT_DEPLOY_PUBLIC_HOST }}
        run: |
          # 创建部署目录
          mkdir -p ${{ env.DEPLOY_DIR }}

          # 复制必要文件到部署目录
          cp ${{ github.workspace }}/nginx.conf ${{ env.DEPLOY_DIR }}/
          cp ${{ github.workspace }}/nginx.frontend.conf ${{ env.DEPLOY_DIR }}/
          cp -r ${{ github.workspace }}/sql ${{ env.DEPLOY_DIR }}/
          cp -r ${{ github.workspace }}/mysql-init ${{ env.DEPLOY_DIR }}/
          cp -r ${{ github.workspace }}/node-builder ${{ env.DEPLOY_DIR }}/

          # 切换到部署目录
          cd ${{ env.DEPLOY_DIR }}

          # 生成环境文件
          cat > .env << EOF
          IMAGE_REPOSITORY=${IMAGE_REPOSITORY}
          IMAGE_TAG_SUFFIX=${IMAGE_TAG_SUFFIX}
          CODE_CRAFT_MYSQL_ROOT_PASSWORD=${CODE_CRAFT_MYSQL_ROOT_PASSWORD}
          CODE_CRAFT_MYSQL_DATABASE=${CODE_CRAFT_MYSQL_DATABASE}
          CODE_CRAFT_MYSQL_USERNAME=${CODE_CRAFT_MYSQL_USERNAME}
          CODE_CRAFT_MYSQL_PASSWORD=${CODE_CRAFT_MYSQL_PASSWORD}
          CODE_CRAFT_NACOS_USERNAME=${CODE_CRAFT_NACOS_USERNAME}
          CODE_CRAFT_NACOS_PASSWORD=${CODE_CRAFT_NACOS_PASSWORD}
          DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          TENCENT_COS_SECRET_ID=${TENCENT_COS_SECRET_ID}
          TENCENT_COS_SECRET_KEY=${TENCENT_COS_SECRET_KEY}
          TENCENT_COS_REGION=${TENCENT_COS_REGION}
          TENCENT_COS_BUCKET=${TENCENT_COS_BUCKET}
          TENCENT_COS_HOST=${TENCENT_COS_HOST}
          NODE_BUILDER_PORT=${NODE_BUILDER_PORT}
          CODE_CRAFT_DEPLOY_PUBLIC_HOST=${CODE_CRAFT_DEPLOY_PUBLIC_HOST}
          EOF

          # 生成 docker-compose.yml (Infrastructure as Code)
          cat > docker-compose.yml << 'COMPOSE_EOF'
          services:
            mysql:
              image: mysql:8.0
              container_name: code-craft-mysql
              environment:
                MYSQL_ROOT_PASSWORD: ${CODE_CRAFT_MYSQL_ROOT_PASSWORD}
                MYSQL_DATABASE: ${CODE_CRAFT_MYSQL_DATABASE}
                MYSQL_USER: ${CODE_CRAFT_MYSQL_USERNAME}
                MYSQL_PASSWORD: ${CODE_CRAFT_MYSQL_PASSWORD}
              ports:
                - "3307:3306"
              volumes:
                - mysql_data:/var/lib/mysql
                - ./sql/create_table.sql:/docker-entrypoint-initdb.d/1_create_table.sql
                - ./mysql-init/mysql-schema.sql:/docker-entrypoint-initdb.d/2_nacos_schema.sql
              command: --default-authentication-plugin=mysql_native_password
              networks:
                - code-craft-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${CODE_CRAFT_MYSQL_ROOT_PASSWORD}"]
                interval: 10s
                timeout: 10s
                retries: 10
                start_period: 60s

            redis:
              image: redis:7-alpine
              container_name: code-craft-redis
              ports:
                - "6379:6379"
              volumes:
                - redis_data:/data
              networks:
                - code-craft-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 5s
                retries: 5

            nacos-db-init:
              image: mysql:8.0
              container_name: code-craft-nacos-db-init
              environment:
                MYSQL_ROOT_PASSWORD: ${CODE_CRAFT_MYSQL_ROOT_PASSWORD}
              volumes:
                - ./sql/create_table.sql:/docker-entrypoint-initdb.d/1_create_table.sql
                - ./mysql-init/mysql-schema.sql:/docker-entrypoint-initdb.d/2_nacos_schema.sql
              networks:
                - code-craft-network
              restart: "no"
              command: >
                sh -c "
                  echo 'Waiting for MySQL...';
                  until mysql -h mysql -uroot -p${CODE_CRAFT_MYSQL_ROOT_PASSWORD} -e 'SELECT 1' 2>/dev/null; do
                    sleep 2;
                  done;
                  echo 'MySQL is ready, executing init scripts...';
                  mysql -h mysql -uroot -p${CODE_CRAFT_MYSQL_ROOT_PASSWORD} < /docker-entrypoint-initdb.d/1_create_table.sql;
                  mysql -h mysql -uroot -p${CODE_CRAFT_MYSQL_ROOT_PASSWORD} < /docker-entrypoint-initdb.d/2_nacos_schema.sql;
                  echo 'Initialization completed, exiting...'
                "
              depends_on:
                mysql:
                  condition: service_healthy

            nacos:
              image: nacos/nacos-server:v2.5.2
              container_name: code-craft-nacos
              environment:
                JAVA_TOOL_OPTIONS: "-Xmx4g -Xms2g -Xss4m"
                MODE: standalone
                SPRING_DATASOURCE_PLATFORM: mysql
                MYSQL_SERVICE_HOST: mysql
                MYSQL_SERVICE_PORT: 3306
                MYSQL_SERVICE_DB_NAME: nacos
                MYSQL_SERVICE_USER: ${CODE_CRAFT_MYSQL_USERNAME}
                MYSQL_SERVICE_PASSWORD: ${CODE_CRAFT_MYSQL_PASSWORD}
                NACOS_AUTH_ENABLE: "false"
                NACOS_AUTH_USERNAME: ${CODE_CRAFT_NACOS_USERNAME}
                NACOS_AUTH_PASSWORD: ${CODE_CRAFT_NACOS_PASSWORD}
              ports:
                - "8848:8848"
                - "9848:9848"
                - "9849:9849"
              volumes:
                - nacos_logs:/home/nacos/logs
                - nacos_data:/home/nacos/data
              networks:
                - code-craft-network
              restart: unless-stopped
              depends_on:
                mysql:
                  condition: service_healthy
                nacos-db-init:
                  condition: service_completed_successfully
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/ns/instance/list?serviceName=nacos"]
                interval: 10s
                timeout: 5s
                retries: 10

            user-service:
              image: ${IMAGE_REPOSITORY}:user-service-${IMAGE_TAG_SUFFIX}
              container_name: code-craft-user-service
              environment:
                JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:+UseG1GC"
                CODE_CRAFT_MYSQL_HOST: mysql
                CODE_CRAFT_MYSQL_PORT: 3306
                CODE_CRAFT_MYSQL_DATABASE: ${CODE_CRAFT_MYSQL_DATABASE}
                CODE_CRAFT_MYSQL_USERNAME: ${CODE_CRAFT_MYSQL_USERNAME}
                CODE_CRAFT_MYSQL_PASSWORD: ${CODE_CRAFT_MYSQL_PASSWORD}
                CODE_CRAFT_REDIS_HOST: redis
                CODE_CRAFT_REDIS_PORT: 6379
                CODE_CRAFT_REDIS_PASSWORD: ""
                CODE_CRAFT_NACOS_HOST: nacos
                CODE_CRAFT_NACOS_PORT: 8848
                CODE_CRAFT_NACOS_USERNAME: ${CODE_CRAFT_NACOS_USERNAME}
                CODE_CRAFT_NACOS_PASSWORD: ${CODE_CRAFT_NACOS_PASSWORD}
              ports:
                - "8124:8124"
              networks:
                - code-craft-network
              restart: unless-stopped
              depends_on:
                mysql:
                  condition: service_healthy
                redis:
                  condition: service_healthy
                nacos:
                  condition: service_started

            app-service:
              image: ${IMAGE_REPOSITORY}:app-service-${IMAGE_TAG_SUFFIX}
              container_name: code-craft-app-service
              environment:
                JAVA_TOOL_OPTIONS: "-Xmx1024m -Xms512m -XX:+UseG1GC"
                CODE_CRAFT_MYSQL_HOST: mysql
                CODE_CRAFT_MYSQL_PORT: 3306
                CODE_CRAFT_MYSQL_DATABASE: ${CODE_CRAFT_MYSQL_DATABASE}
                CODE_CRAFT_MYSQL_USERNAME: ${CODE_CRAFT_MYSQL_USERNAME}
                CODE_CRAFT_MYSQL_PASSWORD: ${CODE_CRAFT_MYSQL_PASSWORD}
                CODE_CRAFT_REDIS_HOST: redis
                CODE_CRAFT_REDIS_PORT: 6379
                CODE_CRAFT_REDIS_PASSWORD: ""
                CODE_CRAFT_NACOS_HOST: nacos
                CODE_CRAFT_NACOS_PORT: 8848
                CODE_CRAFT_NACOS_USERNAME: ${CODE_CRAFT_NACOS_USERNAME}
                CODE_CRAFT_NACOS_PASSWORD: ${CODE_CRAFT_NACOS_PASSWORD}
                DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
                DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
                TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID}
                TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY}
                TENCENT_COS_REGION: ${TENCENT_COS_REGION}
                TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET}
                TENCENT_COS_HOST: ${TENCENT_COS_HOST}
                CODE_CRAFT_DEPLOY_HOST: ${CODE_CRAFT_DEPLOY_PUBLIC_HOST}
                CODE_CRAFT_CODE_OUTPUT_DIR: /tmp/code_output
                CODE_CRAFT_CODE_DEPLOY_DIR: /tmp/code_deploy
                CODE_CRAFT_CODE_UPLOAD_DIR: /tmp/uploads
                CODE_CRAFT_NODE_BUILDER_URL: http://node-builder:${NODE_BUILDER_PORT:-8020}/build
              ports:
                - "8126:8126"
              volumes:
                - code_output:/tmp/code_output
                - code_deploy:/tmp/code_deploy
                - code_upload:/tmp/uploads
              networks:
                - code-craft-network
              restart: unless-stopped
              depends_on:
                mysql:
                  condition: service_healthy
                redis:
                  condition: service_healthy
                nacos:
                  condition: service_started
                node-builder:
                  condition: service_started

            screenshot-service:
              image: ${IMAGE_REPOSITORY}:screenshot-service-${IMAGE_TAG_SUFFIX}
              container_name: code-craft-screenshot-service
              shm_size: '512mb'
              environment:
                JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
                CODE_CRAFT_MYSQL_HOST: mysql
                CODE_CRAFT_MYSQL_PORT: 3306
                CODE_CRAFT_MYSQL_DATABASE: ${CODE_CRAFT_MYSQL_DATABASE}
                CODE_CRAFT_MYSQL_USERNAME: ${CODE_CRAFT_MYSQL_USERNAME}
                CODE_CRAFT_MYSQL_PASSWORD: ${CODE_CRAFT_MYSQL_PASSWORD}
                CODE_CRAFT_REDIS_HOST: redis
                CODE_CRAFT_REDIS_PORT: 6379
                CODE_CRAFT_REDIS_PASSWORD: ""
                CODE_CRAFT_NACOS_HOST: nacos
                CODE_CRAFT_NACOS_PORT: 8848
                CODE_CRAFT_NACOS_USERNAME: ${CODE_CRAFT_NACOS_USERNAME}
                CODE_CRAFT_NACOS_PASSWORD: ${CODE_CRAFT_NACOS_PASSWORD}
                TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID}
                TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY}
                TENCENT_COS_REGION: ${TENCENT_COS_REGION}
                TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET}
                TENCENT_COS_HOST: ${TENCENT_COS_HOST}
              deploy:
                resources:
                  limits:
                    memory: 1G
                  reservations:
                    memory: 256M
              ports:
                - "8127:8127"
              networks:
                - code-craft-network
              restart: unless-stopped
              depends_on:
                mysql:
                  condition: service_healthy
                redis:
                  condition: service_healthy
                nacos:
                  condition: service_started

            node-builder:
              image: ${IMAGE_REPOSITORY}:node-builder-${IMAGE_TAG_SUFFIX}
              container_name: code-craft-node-builder
              working_dir: /app
              volumes:
                - code_output:/tmp/code_output
              environment:
                NODE_ENV: production
                PORT: ${NODE_BUILDER_PORT:-8020}
              networks:
                - code-craft-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${NODE_BUILDER_PORT:-8020}/health"]
                interval: 30s
                timeout: 10s
                start_period: 10s
                retries: 3

            frontend:
              image: ${IMAGE_REPOSITORY}:frontend-${IMAGE_TAG_SUFFIX}
              container_name: code-craft-frontend
              restart: unless-stopped
              networks:
                - code-craft-network
              ports:
                - "8090:80"
              depends_on:
                app-service:
                  condition: service_started
                user-service:
                  condition: service_started
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
                interval: 30s
                timeout: 10s
                start_period: 10s
                retries: 3

            nginx:
              image: nginx:alpine
              container_name: code-craft-nginx
              restart: unless-stopped
              ports:
                - "8888:80"
                - "443:443"
              volumes:
                - ./nginx.conf:/etc/nginx/nginx.conf
                - code_deploy:/usr/share/nginx/html/deploy
              networks:
                - code-craft-network
              depends_on:
                frontend:
                  condition: service_started
                user-service:
                  condition: service_started
                app-service:
                  condition: service_started
                screenshot-service:
                  condition: service_started
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
                interval: 30s
                timeout: 10s
                start_period: 10s
                retries: 3

          volumes:
            mysql_data:
              name: code-craft-prod_mysql_data
            redis_data:
              name: code-craft-prod_redis_data
            nacos_logs:
              name: code-craft-prod_nacos_logs
            nacos_data:
              name: code-craft-prod_nacos_data
            code_deploy:
              name: code-craft-prod_code_deploy
            code_output:
              name: code-craft-prod_code_output
            code_upload:
              name: code-craft-prod_code_upload

          networks:
            code-craft-network:
              driver: bridge
          COMPOSE_EOF

          echo "=== Generated docker-compose.yml ==="
          head -50 docker-compose.yml

      - name: Deploy Services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "=== Step 1: Force Cleanup All Existing Containers ==="

          # 1. 先尝试 docker compose down（如果之前有配置文件）
          docker compose down --remove-orphans 2>/dev/null || true

          # 2. 强制停止并删除所有 code-craft 相关容器（包括之前部署的）
          echo "Force removing any existing containers..."
          docker ps -a --filter "name=code-craft" -q 2>/dev/null | xargs -r docker stop -t 5 2>/dev/null || true
          docker ps -a --filter "name=code-craft" -q 2>/dev/null | xargs -r docker rm -f 2>/dev/null || true

          # 3. 删除可能存在的旧项目容器（包括 mysql、redis 等基础设施）
          for container in code-craft-mysql code-craft-redis code-craft-nacos code-craft-user-service code-craft-app-service code-craft-screenshot-service code-craft-frontend code-craft-nginx code-craft-node-builder code-craft-nacos-db-init; do
            if docker ps -a --format "{{.Names}}" | grep -q "^${container}$"; then
              echo "Removing existing container: $container"
              docker stop -t 5 "$container" 2>/dev/null || true
              docker rm -f "$container" 2>/dev/null || true
            fi
          done

          # 4. 确认所有容器已删除
          echo "Verifying cleanup..."
          for i in {1..10}; do
            COUNT=$(docker ps -a --filter "name=code-craft" -q 2>/dev/null | wc -l)
            if [ "$COUNT" -eq 0 ]; then
              echo "✓ All containers removed"
              break
            fi
            echo "Still have $COUNT containers, retrying... ($i/10)"
            docker ps -a --filter "name=code-craft" -q 2>/dev/null | xargs -r docker rm -f 2>/dev/null || true
            sleep 1
          done

          # 5. 清理孤立卷和网络
          docker volume prune -f 2>/dev/null || true
          docker network prune -f 2>/dev/null || true

          echo "=== Step 2: Pull Latest Images ==="
          docker compose pull mysql redis nacos nginx

          echo "=== Step 2.1: Fix Writable Volume Permissions ==="
          docker compose run --rm --no-deps --user root --entrypoint sh app-service -c "mkdir -p /tmp/code_output /tmp/code_deploy /tmp/uploads && chown -R spring:spring /tmp/code_output /tmp/code_deploy /tmp/uploads"

          echo "=== Step 3: Start Infrastructure ==="
          docker compose up -d mysql redis

          # Wait for MySQL
          echo "Waiting for MySQL..."
          for i in {1..60}; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' code-craft-mysql 2>/dev/null || echo "starting")
            if [ "$HEALTH" = "healthy" ]; then
              echo "✓ MySQL healthy"
              break
            fi
            sleep 5
          done

          # Wait for Redis
          sleep 3

          echo "=== Step 4: Start Nacos ==="
          docker compose up -d nacos-db-init nacos
          for i in {1..90}; do
            RUNNING=$(docker inspect --format='{{.State.Running}}' code-craft-nacos 2>/dev/null || echo "false")
            if [ "$RUNNING" = "true" ]; then
              sleep 20
              echo "✓ Nacos running"
              break
            fi
            sleep 5
          done

          echo "=== Step 5: Start Backend Services ==="
          docker compose up -d user-service app-service screenshot-service
          for i in {1..30}; do
            USER=$(docker inspect --format='{{.State.Health.Status}}' code-craft-user-service 2>/dev/null || echo "starting")
            APP=$(docker inspect --format='{{.State.Health.Status}}' code-craft-app-service 2>/dev/null || echo "starting")
            if [ "$USER" = "healthy" ] && [ "$APP" = "healthy" ]; then
              echo "✓ Backend services healthy"
              break
            fi
            sleep 5
          done

          echo "=== Step 6: Start Frontend & Nginx ==="
          docker compose up -d frontend nginx

          echo "=== Step 7: Verify ==="
          docker ps | grep code-craft
          docker image prune -f

          echo "✓ Deployment completed!"
