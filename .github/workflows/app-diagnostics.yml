name: App Service Diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    name: Read code-craft container states and logs
    runs-on: [self-hosted, wsl]
    steps:
      - name: Container states
        shell: bash
        run: |
          docker ps -a --filter name=code-craft --format '{{.Names}}\t{{.Status}}' | sort

      - name: app-service logs (last crash evidence)
        shell: bash
        run: |
          echo "=== last 60 lines ==="
          docker logs code-craft-app-service --tail 60 2>&1 | tail -60

      - name: user-service logs (tail)
        shell: bash
        run: |
          docker logs code-craft-user-service --tail 25 2>&1 | tail -25
