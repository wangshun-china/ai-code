spring:
  application:
    name: code-craft-app
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  session:
    store-type: redis
    timeout: 2592000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${CODE_CRAFT_MYSQL_HOST:localhost}:${CODE_CRAFT_MYSQL_PORT:3307}/${CODE_CRAFT_MYSQL_DATABASE:ai_code_gen}?serverTimezone=Asia/Shanghai&useLegacyDatetimeCode=false
    username: ${CODE_CRAFT_MYSQL_USERNAME:ai_code_gen_user}
    password: ${CODE_CRAFT_MYSQL_PASSWORD:}
  data:
    redis:
      host: ${CODE_CRAFT_REDIS_HOST:localhost}
      port: ${CODE_CRAFT_REDIS_PORT:6379}
      database: 0
      password: ${CODE_CRAFT_REDIS_PASSWORD:}
      ttl: 3600
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

server:
  port: 8126
  servlet:
    context-path: /
    session:
      cookie:
        max-age: 2592000

spring-ai-alibaba:
  open-ai:
    streaming-chat-model:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen3.6-plus
      max-tokens: 8192
      log-requests: ${CODE_CRAFT_AI_LOG_REQUESTS:false}
      log-responses: ${CODE_CRAFT_AI_LOG_RESPONSES:false}
    reasoning-streaming-chat-model:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen3.6-plus
      max-tokens: 32768
      temperature: 0.1
      log-requests: ${CODE_CRAFT_AI_LOG_REQUESTS:false}
      log-responses: ${CODE_CRAFT_AI_LOG_RESPONSES:false}
    routing-chat-model:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen3.6-plus
      max-tokens: 512
      timeout: ${CODE_CRAFT_AI_ROUTING_TIMEOUT:60s}
      max-retries: ${CODE_CRAFT_AI_ROUTING_MAX_RETRIES:1}
      log-requests: ${CODE_CRAFT_AI_LOG_REQUESTS:false}
      log-responses: ${CODE_CRAFT_AI_LOG_RESPONSES:false}

springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.ws.codecraft.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

dubbo:
  application:
    qos-enable: true
    qos-port: 55555
    qos-accept-foreign-ip: false
  registry:
    address: nacos://${CODE_CRAFT_NACOS_HOST:localhost}:${CODE_CRAFT_NACOS_PORT:8848}?username=${CODE_CRAFT_NACOS_USERNAME:nacos}&password=${CODE_CRAFT_NACOS_PASSWORD:}
    register-mode: instance
  protocol:
    name: tri
    port: 50053
    host: ${CODE_CRAFT_DUBBO_HOST:localhost}
  consumer:
    timeout: 120000
  provider:
    timeout: 120000

code:
  workspace-dir: ${CODE_CRAFT_WORKSPACE_DIR:G:/project/code-craft}
  deploy-host: ${CODE_CRAFT_DEPLOY_HOST:http://localhost:8126}
  node-builder-url: ${CODE_CRAFT_NODE_BUILDER_URL:http://localhost:8020/build}
  build-mode: ${CODE_CRAFT_BUILD_MODE:local}
  output-root-dir: ${CODE_CRAFT_CODE_OUTPUT_DIR:${code.workspace-dir}/tmp/code_output}
  deploy-root-dir: ${CODE_CRAFT_CODE_DEPLOY_DIR:${code.workspace-dir}/tmp/code_deploy}
  upload-root-dir: ${CODE_CRAFT_CODE_UPLOAD_DIR:${code.workspace-dir}/tmp/uploads}

app:
  test-api:
    enabled: ${CODE_CRAFT_TEST_API_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

cos:
  client:
    host: ${TENCENT_COS_HOST:}
    secretId: ${TENCENT_COS_SECRET_ID:}
    secretKey: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:}
    bucket: ${TENCENT_COS_BUCKET:}

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: wan2.2-t2i-flash
